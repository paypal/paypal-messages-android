plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.paypal.messagesdemo'
  compileSdk rootProject.ext.modules.androidTargetVersion

  defaultConfig {
    applicationId "com.paypal.messagesdemo"
    minSdk rootProject.ext.modules.androidMinSdkVersion
    targetSdk rootProject.ext.modules.androidTargetVersion
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables {
      useSupportLibrary true
    }

    buildConfigField("String", "PROD_CLIENT_ID", "\"${System.env.PROD_CLIENT_ID}\"")
    buildConfigField("String", "SANDBOX_CLIENT_ID", "\"${System.env.SANDBOX_CLIENT_ID}\"")
    buildConfigField("String", "STAGE_CLIENT_ID", "\"${System.env.STAGE_CLIENT_ID}\"")
    buildConfigField("String", "LOCAL_CLIENT_ID", "\"${System.env.LOCAL_CLIENT_ID}\"")
  }

	buildFeatures {
		buildConfig = true
		viewBinding = true
		compose = true
	}
  buildTypes {
    debug {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    // Test build with minification enabled to verify consumer ProGuard rules work
    releaseWithMinifyEnabled {
      minifyEnabled true  // Tests consumer ProGuard rules protection
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      matchingFallbacks = ['release']
    }
    // Debug build with minification enabled for easy testing
    debugWithMinifyEnabled {
      debuggable true
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      matchingFallbacks = ['debug']
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  kotlinOptions {
    jvmTarget = '1.8'
  }
  composeOptions {
    kotlinCompilerExtensionVersion '1.4.8'
  }
  packagingOptions {
    resources {
      excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.9.0'
  implementation platform('androidx.compose:compose-bom:2023.05.01')
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
  implementation 'androidx.activity:activity-compose:1.5.1'
  implementation 'com.squareup.okhttp3:okhttp:4.8.0'
  implementation 'com.google.code.gson:gson:2.9.1'

  // Add constraints to ensure compatible versions
  constraints {
    implementation('androidx.activity:activity-ktx') {
      version {
        strictly '1.5.1'
      }
    }
    implementation('androidx.activity:activity') {
      version {
        strictly '1.5.1'
      }
    }
    implementation('androidx.activity:activity-compose') {
      version {
        strictly '1.5.1'
      }
    }
  }

  // Compose dependencies - versions managed by BOM
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-graphics'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material'
	implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
	implementation 'androidx.appcompat:appcompat:1.6.1'
	// Choose one of the following implementation methods (uncomment only one):
	implementation project(':library')
	// implementation files('../library/build/outputs/aar/library-release.aar')
	// For Maven Central release use:
	// implementation 'com.paypal.messages:paypal-messages:1.1.3'
  implementation 'com.google.android.material:material:1.10.0'


  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
  androidTestImplementation platform('androidx.compose:compose-bom:2023.05.01')
  androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

  // Debug implementations for Compose tooling
  debugImplementation 'androidx.compose.ui:ui-tooling'
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
