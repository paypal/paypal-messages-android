apply plugin: 'maven-publish'
apply plugin: 'signing'


ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID') ?: ''
ext["signing.password"] = System.getenv('SIGNING_KEY_PASSWORD') ?: ''
ext["signing.secretKeyRingFile"] = System.getenv('SIGNING_KEY_FILE') ?: ''

// Check if signing is properly configured
def isSigningConfigured = project.hasProperty("signing.keyId") && 
                         project.hasProperty("signing.password") && 
                         project.hasProperty("signing.secretKeyRingFile") &&
                         !project.property("signing.keyId").toString().isEmpty() &&
                         !project.property("signing.password").toString().isEmpty() &&
                         !project.property("signing.secretKeyRingFile").toString().isEmpty()

afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				groupId group
				version project.ext.version
				artifactId project.ext.name
				from components.release

				pom {
					name = project.ext.pom_name ?: ''
					packaging = "aar"  // Force AAR packaging type for Android libraries
					description = project.ext.pom_desc ?: ''
					url = POM_URL
					licenses {
						license {
							name = POM_LICENCE_NAME
							url = POM_LICENCE_URL
						}
					}
					developers {
						developer {
							id = POM_DEVELOPER_ID
							name = POM_DEVELOPER_NAME
							email = POM_DEVELOPER_EMAIL
						}
					}
					scm {
						connection = POM_SCM_CONNECTION
						developerConnection = POM_SCM_DEV_CONNECTION
						url = POM_SCM_URL
					}
					
					// Add dependencies section to the POM
					withXml {
						def dependenciesNode = asNode().appendNode('dependencies')
						
						// Add all implementation dependencies
						try {
							configurations.implementation.allDependencies.each {
								if (it.group != null && it.name != null && it.version != null) {
									def dependencyNode = dependenciesNode.appendNode('dependency')
									dependencyNode.appendNode('groupId', it.group)
									dependencyNode.appendNode('artifactId', it.name)
									dependencyNode.appendNode('version', it.version)
									dependencyNode.appendNode('scope', 'compile')
								}
							}
						} catch (Exception e) {
							// Skip if configuration not found
							logger.warn("Could not add implementation dependencies to POM: ${e.message}")
						}
						
						// Add all api dependencies (if configuration exists)
						try {
							configurations.api.allDependencies.each {
								if (it.group != null && it.name != null && it.version != null) {
									def dependencyNode = dependenciesNode.appendNode('dependency')
									dependencyNode.appendNode('groupId', it.group)
									dependencyNode.appendNode('artifactId', it.name)
									dependencyNode.appendNode('version', it.version)
									dependencyNode.appendNode('scope', 'compile')
								}
							}
						} catch (Exception e) {
							// Skip if configuration not found
							logger.warn("Could not add api dependencies to POM: ${e.message}")
						}
					}
				}
			}
		}
		repositories {
			// Maven Central publishing is handled by the nexus-publish-plugin
			// This repository configuration is for the Central Portal API
			maven {
				name = "centralPortal"
				url = uri("https://central.sonatype.com/api/v1/publisher/upload")
				credentials(HttpHeaderCredentials) {
					name = "Authorization"
					value = "Bearer ${System.getenv('SONATYPE_NEXUS_PASSWORD') ?: ''}"
				}
				authentication {
					header(HttpHeaderAuthentication)
				}
			}
		}
	}

	signing {
		if (isSigningConfigured) {
			sign publishing.publications
			sign configurations.archives
		}
	}
}

task androidSourcesJar(type: Jar) {
	archiveClassifier.set('sources')
	from android.sourceSets.main.java.srcDirs
	from android.sourceSets.main.kotlin.srcDirs
}

artifacts {
	archives androidSourcesJar
}

// Fix the task dependency issue mentioned in the error
if (isSigningConfigured) {
	tasks.matching { it.name == 'signArchives' }.configureEach {
		dependsOn 'releaseSourcesJar'
	}
}
