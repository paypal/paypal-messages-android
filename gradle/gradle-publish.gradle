apply plugin: 'maven-publish'
apply plugin: 'signing'

import org.gradle.authentication.http.HttpHeaderAuthentication
import org.gradle.api.credentials.HttpHeaderCredentials


ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID') ?: ''
ext["signing.password"] = System.getenv('SIGNING_KEY_PASSWORD') ?: ''
ext["signing.secretKeyRingFile"] = System.getenv('SIGNING_KEY_FILE') ?: ''

// Check if signing is properly configured
def isSigningConfigured = project.hasProperty("signing.keyId") && 
                         project.hasProperty("signing.password") && 
                         project.hasProperty("signing.secretKeyRingFile") &&
                         !project.property("signing.keyId").toString().isEmpty() &&
                         !project.property("signing.password").toString().isEmpty() &&
                         !project.property("signing.secretKeyRingFile").toString().isEmpty()

afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				groupId group
				version project.ext.version
				artifactId project.ext.name
				from components.release

				pom {
					name = project.ext.pom_name ?: ''
					packaging = "aar"  // Force AAR packaging type for Android libraries
					description = project.ext.pom_desc ?: ''
					url = POM_URL
					licenses {
						license {
							name = POM_LICENCE_NAME
							url = POM_LICENCE_URL
						}
					}
					developers {
						developer {
							id = POM_DEVELOPER_ID
							name = POM_DEVELOPER_NAME
							email = POM_DEVELOPER_EMAIL
						}
					}
					scm {
						connection = POM_SCM_CONNECTION
						developerConnection = POM_SCM_DEV_CONNECTION
						url = POM_SCM_URL
					}
					// Dependencies are taken from the component
				}
			}
		}
		repositories {
			// Only enable the Central Portal API repository when explicitly requested
			if (project.hasProperty('enableCentralPortalRepo') || System.getenv('CENTRAL_PORTAL') == 'true') {
				maven {
					name = "centralPortal"
					url = uri("https://central.sonatype.com/api/v1/publisher/upload")
					credentials(HttpHeaderCredentials) {
						name = "Authorization"
						value = "Bearer ${System.getenv('SONATYPE_NEXUS_PASSWORD') ?: ''}"
					}
					authentication {
						header(HttpHeaderAuthentication)
					}
				}
			}

			// Default path: deploy to OSSRH (s01) using token auth. Use snapshots vs releases by version.
			maven {
				name = "sonatype"
				def isSnapshot = project.ext.version?.toString()?.endsWith('-SNAPSHOT')
				def releasesRepoUrl = uri("https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/")
				def snapshotsRepoUrl = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
				url = isSnapshot ? snapshotsRepoUrl : releasesRepoUrl
				
				// Check if we're using token authentication (default to false)
				def tokenAuth = System.getenv('SONATYPE_TOKEN_AUTH') == 'true' || findProperty('sonatypeTokenAuth') == 'true'
				
				if (tokenAuth) {
					// Use token-based authentication with Bearer token
					credentials(HttpHeaderCredentials) {
						name = "Authorization"
						value = "Bearer ${System.getenv('SONATYPE_NEXUS_PASSWORD') ?: findProperty('sonatypePassword') ?: ''}"
					}
					authentication {
						header(HttpHeaderAuthentication)
					}
				} else {
					// Use traditional username/password authentication
					credentials {
						username = (findProperty('sonatypeUsername') ?: System.getenv('OSSRH_USERNAME') ?: System.getenv('SONATYPE_NEXUS_USERNAME') ?: '') as String
						password = (findProperty('sonatypePassword') ?: System.getenv('OSSRH_PASSWORD') ?: System.getenv('SONATYPE_NEXUS_PASSWORD') ?: '') as String
					}
				}
			}
		}
	}

	signing {
		if (isSigningConfigured) {
			sign publishing.publications
		}
	}
}

// Removed custom androidSourcesJar and archives publication to avoid duplicate sources/signatures
