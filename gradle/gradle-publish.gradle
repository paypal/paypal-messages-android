apply plugin: 'maven-publish'
apply plugin: 'signing'


ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID') ?: ''
ext["signing.password"] = System.getenv('SIGNING_KEY_PASSWORD') ?: ''
ext["signing.secretKeyRingFile"] = System.getenv('SIGNING_KEY_FILE') ?: ''

afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				groupId group
				version project.ext.version
				artifactId project.ext.name
				from components.release

				pom {
					name = project.ext.pom_name ?: ''
					packaging = POM_PACKAGING
					description = project.ext.pom_desc ?: ''
					url = POM_URL
					licenses {
						license {
							name = POM_LICENCE_NAME
							url = POM_LICENCE_URL
						}
					}
					developers {
						developer {
							id = POM_DEVELOPER_ID
							name = POM_DEVELOPER_NAME
							email = POM_DEVELOPER_EMAIL
						}
					}
					scm {
						connection = POM_SCM_CONNECTION
						developerConnection = POM_SCM_DEV_CONNECTION
						url = POM_SCM_URL
					}
				}
			}
		}
		repositories {
			// Continue to use standard OSSRH repositories as Central Portal doesn't have official Gradle support yet
			// Use standard username/password authentication 
			if (version.endsWith('-SNAPSHOT')) {
				maven {
					name = "sonatypeSnapshots"
					url = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
					credentials {
						username = System.getenv('SONATYPE_NEXUS_USERNAME') ?: ''
						password = System.getenv('SONATYPE_NEXUS_PASSWORD') ?: ''
					}
				}
			} else {
				// For regular releases
				maven {
					name = "sonatypeReleases"
					url = uri("https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/")
					credentials {
						username = System.getenv('SONATYPE_NEXUS_USERNAME') ?: ''
						password = System.getenv('SONATYPE_NEXUS_PASSWORD') ?: ''
					}
				}
			}
		}
	}

	signing {
		sign publishing.publications
		sign configurations.archives
	}
}

task androidSourcesJar(type: Jar) {
	archiveClassifier.set('sources')
	from android.sourceSets.main.java.srcDirs
	from android.sourceSets.main.kotlin.srcDirs
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

artifacts {
	archives androidSourcesJar
}
