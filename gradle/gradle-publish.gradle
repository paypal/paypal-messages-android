apply plugin: 'maven-publish'
apply plugin: 'signing'


ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID') ?: ''
ext["signing.password"] = System.getenv('SIGNING_KEY_PASSWORD') ?: ''
ext["signing.secretKeyRingFile"] = System.getenv('SIGNING_KEY_FILE') ?: ''

// Check if signing is properly configured
def isSigningConfigured = project.hasProperty("signing.keyId") && 
                         project.hasProperty("signing.password") && 
                         project.hasProperty("signing.secretKeyRingFile") &&
                         !project.property("signing.keyId").toString().isEmpty() &&
                         !project.property("signing.password").toString().isEmpty() &&
                         !project.property("signing.secretKeyRingFile").toString().isEmpty()

afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				groupId group
				version project.ext.version
				artifactId project.ext.name
				
				// The 'from components.release' is critical for proper AAR publishing
				from components.release
				
				// Explicitly add javadoc and sources to the publication
				artifact androidJavadocJar
				artifact androidSourcesJar

				pom {
					name = project.ext.pom_name ?: 'PayPal Messages'  // Ensure there's always a name in the POM
					packaging = "aar"  // Force AAR packaging type for Android libraries
					description = project.ext.pom_desc ?: ''
					// Fix dependency scopes and XML tag names
					withXml {
						def root = asNode()
						
						// Fix any <n> tags to <name> tags (Maven requires <name> not <n>)
						def nTags = []
						
						// Project name tag
						def projectNameNode = root.children().find { it.name() == 'n' }
						if (projectNameNode) {
							def nameContent = projectNameNode.text()
							root.appendNode('name', nameContent)
							nTags << projectNameNode
						}
						
						// License name tag
						def licensesNode = root.licenses[0]
						if (licensesNode) {
							licensesNode.license.each { licenseNode ->
								def licenseNameNode = licenseNode.children().find { it.name() == 'n' }
								if (licenseNameNode) {
									def nameContent = licenseNameNode.text()
									licenseNode.appendNode('name', nameContent)
									nTags << licenseNameNode
								}
							}
						}
						
						// Developer name tag
						def developersNode = root.developers[0]
						if (developersNode) {
							developersNode.developer.each { devNode ->
								def devNameNode = devNode.children().find { it.name() == 'n' }
								if (devNameNode) {
									def nameContent = devNameNode.text()
									devNode.appendNode('name', nameContent)
									nTags << devNameNode
								}
							}
						}
						
						// Remove all the old n tags after we've processed them
						nTags.each { tag ->
							tag.parent().remove(tag)
						}
						
						// Find the dependencies node created by the android component
						def dependenciesNodes = root.children().findAll { it.name().toString().contains('dependencies') }
						
						// Only process if we found exactly one dependencies node
						if (dependenciesNodes.size() == 1) {
							def dependenciesNode = dependenciesNodes[0]
							
							// Fix runtime scopes to be compile for direct dependencies
							dependenciesNode.children().each { depNode ->
								def scopeNode = depNode.children().find { it.name().toString().contains('scope') }
								if (scopeNode && scopeNode.text() == 'runtime') {
									// For runtime dependencies that should be compile
									def groupId = depNode.children().find { it.name().toString().contains('groupId') }?.text()
									def artifactId = depNode.children().find { it.name().toString().contains('artifactId') }?.text()
									
									// Only change scopes for actual compile dependencies
									def shouldBeCompile = false
									
									// Check if it's in the implementation configuration
									configurations.implementation.allDependencies.each { dep ->
										if (dep.group == groupId && dep.name == artifactId) {
											shouldBeCompile = true
										}
									}
									
									// Or in the api configuration
									configurations.api?.allDependencies?.each { dep ->
										if (dep.group == groupId && dep.name == artifactId) {
											shouldBeCompile = true
										}
									}
									
									// Or it's a key library like OkHttp or GSON that should always be compile
									if (groupId in ['com.google.code.gson', 'com.squareup.okhttp3']) {
										shouldBeCompile = true
									}
									
									if (shouldBeCompile) {
										scopeNode.value = 'compile'
									}
								}
							}
						}
					}
					url = POM_URL
					licenses {
						license {
							name = POM_LICENCE_NAME
							url = POM_LICENCE_URL
						}
					}
					developers {
						developer {
							id = POM_DEVELOPER_ID
							name = POM_DEVELOPER_NAME
							email = POM_DEVELOPER_EMAIL
						}
					}
					scm {
						connection = POM_SCM_CONNECTION
						developerConnection = POM_SCM_DEV_CONNECTION
						url = POM_SCM_URL
					}
					
					// Don't add dependencies section to the POM as it's already included in the default POM generation
					// Gradle already includes dependencies from the component in the generated POM
				}
			}
		}
		repositories {
			// Only enable the Central Portal API repository when explicitly requested
			if (project.hasProperty('enableCentralPortalRepo') || System.getenv('CENTRAL_PORTAL') == 'true') {
				maven {
					name = "centralPortal"
					url = uri("https://central.sonatype.com/api/v1/publisher/upload")
					credentials(HttpHeaderCredentials) {
						name = "Authorization"
						value = "Bearer ${System.getenv('SONATYPE_NEXUS_PASSWORD') ?: ''}"
					}
					authentication {
						header(HttpHeaderAuthentication)
					}
				}
			}

			// Default path: deploy to OSSRH (s01) using basic auth. Use snapshots vs releases by version.
			maven {
				name = "sonatype"
				def isSnapshot = project.ext.version?.toString()?.endsWith('-SNAPSHOT')
				def releasesRepoUrl = uri("https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/")
				def snapshotsRepoUrl = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
				url = isSnapshot ? snapshotsRepoUrl : releasesRepoUrl
				credentials {
					username = (findProperty('sonatypeUsername') ?: System.getenv('SONATYPE_NEXUS_USERNAME') ?: '') as String
					password = (findProperty('sonatypePassword') ?: System.getenv('SONATYPE_NEXUS_PASSWORD') ?: '') as String
				}
			}
		}
	}

	signing {
		if (isSigningConfigured) {
			sign publishing.publications
			sign configurations.archives
		}
	}
}

task androidSourcesJar(type: Jar) {
	archiveClassifier.set('sources')
	from android.sourceSets.main.java.srcDirs
	from android.sourceSets.main.kotlin.srcDirs
}

// Create a Javadoc JAR (required for Maven Central)
task androidJavadocJar(type: Jar) {
	archiveClassifier.set('javadoc')
	// Include at least a placeholder README file for javadoc
	from file("${project.projectDir}/src/main")
	include 'README.md'
	// If README.md doesn't exist, create one
	doFirst {
		def readmeFile = file("${project.projectDir}/src/main/README.md")
		if (!readmeFile.exists()) {
			readmeFile.parentFile.mkdirs()
			readmeFile.text = "# ${project.ext.pom_name ?: project.name}\n\nAPI Documentation\n\nFor full documentation, visit the project website: ${POM_URL ?: 'https://github.com/paypal/paypal-messages-android'}"
		}
	}
}

artifacts {
	archives androidSourcesJar
	archives androidJavadocJar
}

// Fix the task dependency issue mentioned in the error
if (isSigningConfigured) {
	tasks.matching { it.name == 'signArchives' }.configureEach {
		dependsOn 'releaseSourcesJar'
		dependsOn 'androidJavadocJar'
	}
}

// Add a task to generate a test POM file
task generateTestPom {
	group = 'verification'
	description = 'Generates a test POM file to verify publishing configuration'
	
	// Make this task depend on the generatePom task
	dependsOn 'generatePomFileForReleasePublication'
	
	doLast {
		def pomFile = file("${project.buildDir}/publications/release/pom-default.xml")
		if (pomFile.exists()) {
			def testPomDir = file("${project.buildDir}/test-pom")
			testPomDir.mkdirs()
			copy {
				from pomFile
				into testPomDir
			}
			logger.lifecycle("Test POM generated at: ${testPomDir}/pom-default.xml")
			logger.lifecycle("POM content:\n${pomFile.text}")
		} else {
			logger.lifecycle("POM file not found at: ${pomFile.absolutePath}")
		}
	}
}
