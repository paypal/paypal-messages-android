// Top-level build file where you can add configuration options common to all sub-projects/modules.
import org.jmailen.gradle.kotlinter.tasks.LintTask
import org.jmailen.gradle.kotlinter.tasks.FormatTask

buildscript {
	ext.modules = [
		"sdkVersionName"      : "1.1.0",
		"androidMinSdkVersion": 23,
		"androidTargetVersion": 34
	]
	
	dependencies {
		classpath 'org.apache.httpcomponents:httpclient:4.5.13'
		classpath 'com.fasterxml.jackson.core:jackson-databind:2.13.0'
	}
}

plugins {
	id 'com.android.application' version '8.0.2' apply false
	id 'com.android.library' version '8.0.2' apply false
	id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
	id 'org.jmailen.kotlinter' version '3.16.0'
	id 'signing'
}

tasks.register('ktLint', LintTask) {
	group 'formatting'
	source files('demo/src', 'library/src')
	reports = [
		'checkstyle': file('build/reports/ktlint/main-lint.xml')
	]
}

tasks.register('ktFormat', FormatTask) {
	group 'formatting'
	source files('demo/src', 'library/src')
	report = file('build/reports/ktlint/format-report.txt')
}

version modules.sdkVersionName


// Central Portal API integration
import org.apache.http.client.methods.HttpGet
import org.apache.http.client.methods.HttpPost
import org.apache.http.entity.ContentType
import org.apache.http.entity.mime.MultipartEntityBuilder
import org.apache.http.impl.client.HttpClients
import org.apache.http.util.EntityUtils
import com.fasterxml.jackson.databind.ObjectMapper
import java.net.URLEncoder

tasks.register('publishToCentralPortal') {
    group = 'publishing'
    description = 'Publishes artifacts to Sonatype Central Portal'
    
    dependsOn 'assemble'
    // We don't depend on specific signing tasks here
    // as they'll be handled by the publishing task
    
    doLast {
        // Look for token in multiple places for flexibility
        def token = System.getenv('SONATYPE_NEXUS_PASSWORD') ?: 
                   findProperty('sonatypePassword') ?: 
                   project.hasProperty('sonatypePassword') ? project.getProperty('sonatypePassword') : null
        
        if (!token) {
            logger.warn("SONATYPE_NEXUS_PASSWORD environment variable or sonatypePassword property not set")
            logger.warn("Using 'demo-token' for testing only. For production, set SONATYPE_NEXUS_PASSWORD")
            token = "demo-token" // Only for testing - will not work in production!
        }
        
        // The API endpoint
        def apiUrl = "https://central.sonatype.com/api/v1/publisher/upload"
        def publishingType = project.hasProperty('autoPublish') ? "AUTOMATIC" : "USER_MANAGED"
        
        logger.lifecycle("Publishing to Central Portal API with publishing type: ${publishingType}")

        // Find the library .aar file and pom
        def libDir = new File("${project.rootDir}/library/build/outputs/aar/")
        def aarFile = libDir.listFiles().find { it.name.endsWith('.aar') }
        if (!aarFile) {
            throw new GradleException("Could not find library .aar file in ${libDir}")
        }
        
        // Find the signed POM file
        def pomFile = new File("${project.rootDir}/library/build/publications/release/pom-default.xml")
        if (!pomFile.exists()) {
            throw new GradleException("Could not find POM file at ${pomFile}")
        }
        
        // Find signature files
        def aarSigFile = new File(aarFile.absolutePath + '.asc')
        def pomSigFile = new File(pomFile.absolutePath + '.asc')
        
        if (!aarSigFile.exists() || !pomSigFile.exists()) {
            throw new GradleException("Missing signature files. Make sure signing has been performed.")
        }
        
        // Create and execute the HTTP request
        def httpClient = HttpClients.createDefault()
        def httpPost = new HttpPost(apiUrl)
        
        // Set the authorization header with the token
        httpPost.setHeader("Authorization", "Bearer ${token}")
        
        // Create multipart request with files
        def builder = MultipartEntityBuilder.create()
        builder.addTextBody("publishingType", publishingType, ContentType.TEXT_PLAIN)
        builder.addBinaryBody("content", aarFile, ContentType.APPLICATION_OCTET_STREAM, aarFile.name)
        builder.addBinaryBody("pom", pomFile, ContentType.APPLICATION_XML, pomFile.name)
        builder.addBinaryBody("contentSignature", aarSigFile, ContentType.APPLICATION_OCTET_STREAM, aarSigFile.name)
        builder.addBinaryBody("pomSignature", pomSigFile, ContentType.APPLICATION_OCTET_STREAM, pomSigFile.name)
        
        httpPost.setEntity(builder.build())
        
        try {
            def response = httpClient.execute(httpPost)
            def statusCode = response.getStatusLine().getStatusCode()
            def responseBody = EntityUtils.toString(response.getEntity())
            
            if (statusCode >= 200 && statusCode < 300) {
                logger.lifecycle("Publishing to Central Portal API completed successfully")
                logger.lifecycle("Response: ${responseBody}")
            } else {
                throw new GradleException("Failed to publish to Central Portal API. Status code: ${statusCode}, Response: ${responseBody}")
            }
        } catch (Exception e) {
            throw new GradleException("Failed to publish to Central Portal API", e)
        } finally {
            httpClient.close()
        }
    }
}

tasks.register('checkCentralPortalDeployment') {
    group = 'publishing'
    description = 'Checks the status of deployments in Sonatype Central Portal'
    
    doLast {
        // Look for token in multiple places for flexibility
        def token = System.getenv('SONATYPE_NEXUS_PASSWORD') ?: 
                   findProperty('sonatypePassword') ?: 
                   project.hasProperty('sonatypePassword') ? project.getProperty('sonatypePassword') : null
        
        if (!token) {
            logger.warn("SONATYPE_NEXUS_PASSWORD environment variable or sonatypePassword property not set")
            logger.warn("Using 'demo-token' for testing only. For production, set SONATYPE_NEXUS_PASSWORD")
            token = "demo-token" // Only for testing - will not work in production!
        }
        
        // The API endpoint
        def apiUrl = "https://central.sonatype.com/api/v1/publisher/status"
        
        logger.lifecycle("Checking deployment status in Central Portal")
        
        // Get group and artifact information from the library project
        def libraryProject = project.findProject(':library')
        def groupId = libraryProject.group
        def artifactId = libraryProject.name
        def version = libraryProject.version
        
        // Create and execute the HTTP request
        def httpClient = HttpClients.createDefault()
        def httpGet = new HttpGet("${apiUrl}?groupId=${groupId}&artifactId=${artifactId}&version=${version}")
        
        // Set the authorization header with the token
        httpGet.setHeader("Authorization", "Bearer ${token}")
        
        try {
            def response = httpClient.execute(httpGet)
            def statusCode = response.getStatusLine().getStatusCode()
            def responseBody = EntityUtils.toString(response.getEntity())
            
            if (statusCode >= 200 && statusCode < 300) {
                logger.lifecycle("Deployment status check completed successfully")
                
                // Parse the JSON response
                def mapper = new ObjectMapper()
                def result = mapper.readTree(responseBody)
                
                // Display the status information
                logger.lifecycle("Deployment Status:")
                logger.lifecycle("Status: ${result.get('status').asText()}")
                
                if (result.has('message')) {
                    logger.lifecycle("Message: ${result.get('message').asText()}")
                }
                
                if (result.has('expectedCompletionTime')) {
                    logger.lifecycle("Expected Completion: ${result.get('expectedCompletionTime').asText()}")
                }
                
                // Add note about Maven Central sync delay
                logger.lifecycle("\nNOTE: After successful publishing to Central Portal, it typically takes several hours")
                logger.lifecycle("for artifacts to appear on Maven Central (https://repo.maven.apache.org/maven2) and")
                logger.lifecycle("search indexes like mvnrepository.com or search.maven.org.")
            } else {
                logger.warn("Failed to check deployment status. Status code: ${statusCode}, Response: ${responseBody}")
            }
        } catch (Exception e) {
            logger.warn("Failed to check deployment status: ${e.message}")
        } finally {
            httpClient.close()
        }
        
        logger.lifecycle("Deployment status check completed")
    }
}

subprojects {
  group = "com.paypal.messages"
}

//./gradlew -PversionParam=0.0.1 changeReleaseVersion
tasks.register('changeReleaseVersion') {
	doLast {
		def topLevelGradleFile = file('./build.gradle')
		def topLevelGradleFileText = topLevelGradleFile.getText('UTF-8')
		def useSnapshot = System.getenv('USE_SNAPSHOT')
		def snapshotParam = useSnapshot == "true" || useSnapshot == true ? "-SNAPSHOT" : ""
		
		def updatedScript =
			topLevelGradleFileText.replaceFirst(/("sdkVersionName"\s*: )".*",/, '$1"' + versionParam + snapshotParam + '",')
		topLevelGradleFile.write(updatedScript, 'UTF-8')
	}
}
