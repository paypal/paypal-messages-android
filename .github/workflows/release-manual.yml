name: Release (manual)
on:
  workflow_dispatch: {}

env:
  SIGNING_KEY_FILE_PATH: /home/runner/secretKey.gpg

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/release-test.yml

  build:
    uses: ./.github/workflows/build.yml
    secrets:
      SIGNING_KEY_FILE: ${{ secrets.SIGNING_KEY_FILE }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

  release:
    name: Release
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: '0'
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user for release commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Decode Signing Key
        uses: ./.github/actions/decode_signing_key_action
        with:
          signing_key_file: ${{ secrets.SIGNING_KEY_FILE }}
          signing_file_path: ${{ env.SIGNING_KEY_FILE_PATH }}

      - name: Install Semantic Release Dependencies
        run: npm install

      - name: GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          SONATYPE_NEXUS_PASSWORD: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE: ${{ env.SIGNING_KEY_FILE_PATH }}
        run: |
          git fetch --tags --force
          npx semantic-release@21

      - name: Create PR: release -> develop
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "release"
          destination_branch: "develop"
          pr_title: "chore: merge release into develop"
          pr_body: "Automated PR to sync changes from release to develop after publishing."
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR: develop -> release
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "develop"
          destination_branch: "release"
          pr_title: "chore: merge develop into release"
          pr_body: "Automated PR to keep release branch up to date with develop."
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set snapshot environment variable
        run: echo "USE_SNAPSHOT=false" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to Maven Central
        env:
          SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          SONATYPE_NEXUS_PASSWORD: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE: ${{ env.SIGNING_KEY_FILE_PATH }}
        run: |
          echo "Running direct deployment script..."
          bash -e ./deploy-to-maven-central.sh --no-auto-publish

      - name: Cleanup signing key files
        if: always()
        run: |
          shred -u -z -n 3 "${SIGNING_KEY_FILE_PATH}" || rm -f "${SIGNING_KEY_FILE_PATH}"
          rm -f ~/secretKey.gpg.b64 || true
        shell: bash 