name: Central Portal Snapshot Release
on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: 'Publishing type (AUTOMATIC or USER_MANAGED)'
        type: choice
        default: 'AUTOMATIC'
        options:
          - AUTOMATIC
          - USER_MANAGED
      snapshot_version:
        description: 'Optional version override (e.g., 1.0.5-SNAPSHOT)'
        required: false
        type: string

env:
  SIGNING_KEY_FILE_PATH: /home/runner/secretKey.gpg
  CENTRAL_PORTAL_URL: https://central.sonatype.com

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/release-test.yml

  build-and-publish:
    name: Build and Publish Snapshot
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # pulls all commits (needed for semantic release to correctly version)
          fetch-depth: '0'
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Decode Signing Key
        uses: ./.github/actions/decode_signing_key_action
        with:
          signing_key_file: ${{ secrets.SIGNING_KEY_FILE }}
          signing_file_path: ${{ env.SIGNING_KEY_FILE_PATH }}

      # Set SNAPSHOT version
      - name: Set snapshot version
        run: |
          if [ -n "${{ github.event.inputs.snapshot_version }}" ]; then
            # Use the user-provided version
            SNAPSHOT_VERSION="${{ github.event.inputs.snapshot_version }}"
          else
            # Generate a version from the current timestamp
            TIMESTAMP=$(date +%Y%m%d%H%M)
            SNAPSHOT_VERSION="1.0.4-$TIMESTAMP-SNAPSHOT"
          fi
          
          echo "Setting version to $SNAPSHOT_VERSION"
          echo "SNAPSHOT_VERSION=$SNAPSHOT_VERSION" >> $GITHUB_ENV
          
          # Update the version in build.gradle
          ./gradlew -PversionParam="$SNAPSHOT_VERSION" changeReleaseVersion

      # Build the project and generate bundle
      - name: Build and assemble bundle
        run: |
          # Set the USE_SNAPSHOT environment variable to true
          export USE_SNAPSHOT=true
          
          # Build and sign the artifacts
          ./gradlew clean build androidSourcesJar signArchives
          
          # Make the bundle creation script executable
          chmod +x .github/scripts/create-maven-bundle.sh
          
          # Create the bundle using our helper script
          ./.github/scripts/create-maven-bundle.sh \
            --version "${{ env.SNAPSHOT_VERSION }}" \
            --group-id "com.paypal.messages" \
            --artifact-id "paypal-messages" \
            --output-dir "bundle" \
            --output-zip "bundle.zip"
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE: ${{ env.SIGNING_KEY_FILE_PATH }}

      # Upload the bundle to Central Portal
      - name: Upload bundle to Central Portal
        run: |
          # Set the publishing type
          PUBLISHING_TYPE="${{ github.event.inputs.publish_type }}"
          
          # Generate the authorization header with the token
          AUTH_HEADER="Bearer ${{ secrets.CENTRAL_PORTAL_TOKEN }}"
          
          # Upload the bundle
          RESPONSE=$(curl -X POST \
            -H "Authorization: $AUTH_HEADER" \
            -F "bundle=@bundle.zip" \
            -F "name=paypal-messages-${{ env.SNAPSHOT_VERSION }}" \
            -F "publishingType=$PUBLISHING_TYPE" \
            -s \
            ${{ env.CENTRAL_PORTAL_URL }}/api/v1/publisher/upload)
            
          # Extract the deployment ID from the response
          DEPLOYMENT_ID=$(echo $RESPONSE | jq -r '.deploymentId')
          
          if [ "$DEPLOYMENT_ID" == "null" ]; then
            echo "Error: Failed to upload bundle"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      # Monitor the deployment status
      - name: Check deployment status
        run: |
          # Generate the authorization header with the token
          AUTH_HEADER="Bearer ${{ secrets.CENTRAL_PORTAL_TOKEN }}"
          
          # Function to check status
          check_status() {
            curl -X GET \
              -H "Authorization: $AUTH_HEADER" \
              -s \
              ${{ env.CENTRAL_PORTAL_URL }}/api/v1/publisher/status?deploymentId=${{ env.DEPLOYMENT_ID }}
          }
          
          # Poll the status endpoint
          echo "Checking deployment status..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RESPONSE=$(check_status)
            STATUS=$(echo $RESPONSE | jq -r '.state')
            
            echo "Current status: $STATUS"
            
            if [ "$STATUS" == "PUBLISHED" ]; then
              echo "Deployment published successfully!"
              exit 0
            elif [ "$STATUS" == "FAILED" ]; then
              echo "Deployment failed: $RESPONSE"
              exit 1
            elif [ "$STATUS" == "VALIDATED" ]; then
              if [ "${{ github.event.inputs.publish_type }}" == "USER_MANAGED" ]; then
                echo "Deployment validated. Manual publishing required."
                exit 0
              else
                echo "Deployment validated, waiting for publishing..."
              fi
            fi
            
            ATTEMPT=$((ATTEMPT+1))
            echo "Waiting for status change... (Attempt $ATTEMPT of $MAX_ATTEMPTS)"
            sleep 10
          done
          
          echo "Timed out waiting for deployment to complete"
          exit 1