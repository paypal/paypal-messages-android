name: Snapshot Release
on:
  workflow_dispatch: {}
env:
  SIGNING_KEY_FILE_PATH: /home/runner/secretKey.gpg

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/release-test.yml

  build:
    uses: ./.github/workflows/build.yml
    secrets:
      SIGNING_KEY_FILE: ${{ secrets.SIGNING_KEY_FILE }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # after build and unit tests are finished, publish all modules at once
  # to help reduce the probability of failure when interacting with sonatype servers
  release:
    name: Snapshot Release
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          # pulls all commits (needed for semantic release to correctly version)
          fetch-depth: '0'
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Decode Signing Key
        uses: ./.github/actions/decode_signing_key_action
        with:
          signing_key_file: ${{ secrets.SIGNING_KEY_FILE }}
          signing_file_path: ${{ env.SIGNING_KEY_FILE_PATH }}

      - name: Set snapshot environment variable
        run: echo "USE_SNAPSHOT=true" >> $GITHUB_ENV

      - name: Install Semantic Release Dependencies
        run: npm install

      - name: GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          SONATYPE_NEXUS_PASSWORD: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_FILE: ${{ env.SIGNING_KEY_FILE_PATH }}
        run: npx semantic-release@21

      # Legacy OSSRH publishing method
      - name: Publish to Maven (Legacy)
        if: ${{ !vars.USE_CENTRAL_PORTAL || vars.USE_CENTRAL_PORTAL != 'true' }}
        uses: ./.github/actions/publish_all_modules
        with:
          sonatype_user: ${{ secrets.SONATYPE_SDKS_NEXUS_USERNAME }}
          sonatype_password: ${{ secrets.SONATYPE_SDKS_NEXUS_PASSWORD }}
          signing_key_id: ${{ secrets.SIGNING_KEY_ID }}
          signing_key_password: ${{ secrets.SIGNING_KEY_PASSWORD }}
          signing_key_file: ${{ env.SIGNING_KEY_FILE_PATH }}
          
      # Debug step to check for secrets
      - name: Debug Secrets Availability
        run: |
          echo "Checking secrets availability (values will not be shown)"
          echo "SONATYPE_NEXUS_USERNAME exists: ${{ secrets.SONATYPE_NEXUS_USERNAME != '' }}"
          echo "SONATYPE_NEXUS_PASSWORD exists: ${{ secrets.SONATYPE_NEXUS_PASSWORD != '' }}"
          echo "SIGNING_KEY_ID exists: ${{ secrets.SIGNING_KEY_ID != '' }}"
          if [ -n "${{ secrets.SONATYPE_NEXUS_PASSWORD }}" ]; then
            echo "SONATYPE_NEXUS_PASSWORD is set and not empty"
          else
            echo "SONATYPE_NEXUS_PASSWORD is empty or not set"
          fi
          
      # Set environment variables with GitHub secrets for all subsequent steps
      - name: Setup Sonatype Credentials
        run: |
          echo "Checking credentials availability for Sonatype publishing"
          
          # Check username availability (without printing value)
          if [ -n "${{ secrets.SONATYPE_NEXUS_USERNAME }}" ]; then
            echo "Username is available from repository secrets"
            # Set environment variable explicitly for subsequent steps and composite actions
            echo "SONATYPE_NEXUS_USERNAME=${{ secrets.SONATYPE_NEXUS_USERNAME }}" >> $GITHUB_ENV
          else
            echo "Username is not available - using dummy value for testing"
            echo "SONATYPE_NEXUS_USERNAME=dummy-user" >> $GITHUB_ENV
          fi
          
          # Check password/token availability (without printing value)
          if [ -n "${{ secrets.SONATYPE_NEXUS_PASSWORD }}" ]; then
            echo "Password/token is available from repository secrets"
            # Set environment variable explicitly for subsequent steps and composite actions
            echo "SONATYPE_NEXUS_PASSWORD=${{ secrets.SONATYPE_NEXUS_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Password/token is not available - using dummy value for testing"
            echo "SONATYPE_NEXUS_PASSWORD=dummy-token-for-testing" >> $GITHUB_ENV
          fi
          
      # New Central Portal publishing method
      - name: Publish to Central Portal
        if: ${{ vars.USE_CENTRAL_PORTAL == 'true' }}
        uses: ./.github/actions/publish_central_portal
        with:
          signing_key_id: ${{ secrets.SIGNING_KEY_ID }}
          signing_key_password: ${{ secrets.SIGNING_KEY_PASSWORD }}
          signing_key_file: ${{ env.SIGNING_KEY_FILE_PATH }}
          auto_publish: 'true'
        # No env block needed here - we're using GITHUB_ENV to pass variables
