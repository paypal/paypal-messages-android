name: 'Publish to Maven Central'
description: 'Publishes all modules using the Maven Central Portal Plugin'
inputs:
  sonatype_user:
    description: 'Sonatype user'
    required: true
    default: ''
  sonatype_token:
    description: 'Sonatype user token'
    required: true
    default: ''
  signing_key_id:
    description: 'Signing key id'
    required: true
    default: ''
  signing_key_password:
    description: 'Signing key password'
    required: true
    default: ''
  signing_key_file:
    description: 'Signing key file'
    required: true
    default: ''
  auto_publish:
    description: 'Whether to publish automatically'
    required: false
    default: 'true'
  use_snapshot:
    description: 'Whether to publish as a SNAPSHOT version'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: 3.9.5

    - name: Create Maven settings directory
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/.mvn

    - name: Create Maven settings file
      shell: bash
      run: |
        cat > ${{ github.workspace }}/.mvn/maven-settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
                <server>
                    <id>central</id>
                    <username>${env.SONATYPE_NEXUS_USERNAME}</username>
                    <password>${env.SONATYPE_NEXUS_PASSWORD}</password>
                </server>
            </servers>
            <profiles>
                <profile>
                    <id>gpg</id>
                    <properties>
                        <gpg.executable>gpg</gpg.executable>
                        <gpg.keyname>${env.SIGNING_KEY_ID}</gpg.keyname>
                        <gpg.passphrase>${env.SIGNING_KEY_PASSWORD}</gpg.passphrase>
                    </properties>
                </profile>
            </profiles>
            <activeProfiles>
                <activeProfile>gpg</activeProfile>
            </activeProfiles>
        </settings>
        EOF

    - name: Prepare and publish (NMCP aggregation)
      shell: bash
      env:
        SONATYPE_NEXUS_USERNAME: ${{ inputs.sonatype_user }}
        SONATYPE_NEXUS_PASSWORD: ${{ inputs.sonatype_token }}
        SIGNING_KEY_ID: ${{ inputs.signing_key_id }}
        SIGNING_KEY_PASSWORD: ${{ inputs.signing_key_password }}
        SIGNING_KEY_FILE: ${{ inputs.signing_key_file }}
        USE_SNAPSHOT: ${{ inputs.use_snapshot }}
        AUTO_PUBLISH: ${{ inputs.auto_publish }}
      run: |
        echo "Using NMCP aggregation for Central Portal publishing (limited to :library)"

        # Verify module exists
        if [ ! -d "${{ github.workspace }}/library" ]; then
          echo "Error: library directory not found"
          exit 1
        fi

        # Current version in gradle
        VERSION=$(grep -o '"sdkVersionName"\s*:\s*"[^"]*"' ${{ github.workspace }}/build.gradle | grep -o '"[^"]*"$' | tr -d '"')

        # Toggle snapshot if requested
        if [ "$USE_SNAPSHOT" = "true" ]; then
          [[ "$VERSION" != *-SNAPSHOT ]] && VERSION="${VERSION}-SNAPSHOT"
          echo "Publishing SNAPSHOT version: $VERSION"
        else
          [[ "$VERSION" == *-SNAPSHOT ]] && VERSION="${VERSION%-SNAPSHOT}"
          echo "Publishing release version: $VERSION"
        fi

        # Import GPG key
        echo "Importing GPG key for signing"
        gpg --batch --import ${{ inputs.signing_key_file }}

        # Persist version to Gradle and pom.xml
        echo "Setting project version to ${VERSION}"
        ./gradlew -PversionParam="$VERSION" changeReleaseVersion --no-daemon --stacktrace

        # Inject NMCP aggregation plugin into root build.gradle
        echo "Configuring root build.gradle with NMCP aggregation plugin"
        cp ${{ github.workspace }}/build.gradle ${{ github.workspace }}/build.gradle.backup
        cat > ${{ github.workspace }}/awk-script.txt << 'EOF'
        /^plugins \{/ {
            print $0
            print "    id \"com.gradleup.nmcp.aggregation\" version \"1.0.2\""
            next
        }
        { print }
        EOF
        awk -f ${{ github.workspace }}/awk-script.txt ${{ github.workspace }}/build.gradle.backup > ${{ github.workspace }}/build.gradle

        # Append NMCP config restricted to :library
        cat > ${{ github.workspace }}/nmcp-config.gradle << EOF
        nmcpAggregation {
          centralPortal {
            username = System.getenv("SONATYPE_NEXUS_USERNAME")
            password = System.getenv("SONATYPE_NEXUS_PASSWORD")
            publishingType = "${AUTO_PUBLISH}" == "true" ? "AUTOMATIC" : "USER_MANAGED"
            publicationName = "PayPal Messages Android"
          }
        }

        dependencies {
          nmcpAggregation(project(":library"))
        }

        project(":library") {
          version = "${VERSION}"
        }
        EOF
        cat ${{ github.workspace }}/nmcp-config.gradle >> ${{ github.workspace }}/build.gradle

        # Build artifacts required by NMCP and generate POM
        ./gradlew clean :library:assemble :library:generateMetadataFileForReleasePublication :library:generatePomFileForReleasePublication --no-daemon --stacktrace

        # Publish using NMCP aggregation (library only)
        ./gradlew --stacktrace nmcpPublishAggregationToCentralPortal \
          -Psigning.keyId="${SIGNING_KEY_ID}" \
          -Psigning.password="${SIGNING_KEY_PASSWORD}" \
          -Psigning.secretKeyRingFile="${SIGNING_KEY_FILE}"

        # Restore root build.gradle
        if [ -f "${{ github.workspace }}/build.gradle.backup" ]; then
          mv ${{ github.workspace }}/build.gradle.backup ${{ github.workspace }}/build.gradle
        fi

        echo "======================================================================"
        echo "NMCP publish finished. Check Sonatype Central Portal for status:"
        echo "https://central.sonatype.com/publishing/deployments"
        echo "======================================================================"