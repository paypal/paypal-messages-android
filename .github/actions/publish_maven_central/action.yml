name: 'Publish to Maven Central'
description: 'Publishes all modules using the Maven Central Portal Plugin'
inputs:
  sonatype_user:
    description: 'Sonatype user'
    required: true
    default: ''
  sonatype_token:
    description: 'Sonatype user token'
    required: true
    default: ''
  signing_key_id:
    description: 'Signing key id'
    required: true
    default: ''
  signing_key_password:
    description: 'Signing key password'
    required: true
    default: ''
  signing_key_file:
    description: 'Signing key file'
    required: true
    default: ''
  auto_publish:
    description: 'Whether to publish automatically'
    required: false
    default: 'true'
  use_snapshot:
    description: 'Whether to publish as a SNAPSHOT version'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: 3.9.5

    - name: Create Maven settings directory
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/.mvn

    - name: Create Maven settings file
      shell: bash
      run: |
        cat > ${{ github.workspace }}/.mvn/maven-settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
                <server>
                    <id>central</id>
                    <username>${env.SONATYPE_NEXUS_USERNAME}</username>
                    <password>${env.SONATYPE_NEXUS_PASSWORD}</password>
                </server>
            </servers>
            <profiles>
                <profile>
                    <id>gpg</id>
                    <properties>
                        <gpg.executable>gpg</gpg.executable>
                        <gpg.keyname>${env.SIGNING_KEY_ID}</gpg.keyname>
                        <gpg.passphrase>${env.SIGNING_KEY_PASSWORD}</gpg.passphrase>
                    </properties>
                </profile>
            </profiles>
            <activeProfiles>
                <activeProfile>gpg</activeProfile>
            </activeProfiles>
        </settings>
        EOF

    - name: Prepare and publish
      shell: bash
      env:
        SONATYPE_NEXUS_USERNAME: ${{ inputs.sonatype_user }}
        SONATYPE_NEXUS_PASSWORD: ${{ inputs.sonatype_token }}
        SIGNING_KEY_ID: ${{ inputs.signing_key_id }}
        SIGNING_KEY_PASSWORD: ${{ inputs.signing_key_password }}
        SIGNING_KEY_FILE: ${{ inputs.signing_key_file }}
        USE_SNAPSHOT: ${{ inputs.use_snapshot }}
        AUTO_PUBLISH: ${{ inputs.auto_publish }}
      run: |
        echo "Using Gradle publishing with Sonatype Central Portal Maven Plugin"

        # Verify we have the library module
        if [ ! -d "${{ github.workspace }}/library" ]; then
          echo "Error: library directory not found"
          exit 1
        fi

        # Get version from build.gradle
        VERSION=$(grep -o '"sdkVersionName"\s*:\s*"[^"]*"' ${{ github.workspace }}/build.gradle | grep -o '"[^"]*"$' | tr -d '"')

        # Apply snapshot toggle if requested
        if [ "$USE_SNAPSHOT" = "true" ]; then
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            VERSION="${VERSION}-SNAPSHOT"
          fi
          echo "Publishing SNAPSHOT version: $VERSION"
        else
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            VERSION="${VERSION%-SNAPSHOT}"
          fi
          echo "Publishing release version: $VERSION"
        fi

        # Import GPG key for signing
        echo "Importing GPG key for signing"
        gpg --batch --import ${{ inputs.signing_key_file }}

        # Persist the computed version to gradle and pom.xml via existing task
        echo "Setting project version to ${VERSION}"
        ./gradlew -PversionParam="$VERSION" changeReleaseVersion --no-daemon --stacktrace

        # Clean and build artifacts
        echo "Cleaning and building artifacts..."
        ./gradlew clean :library:assembleRelease :library:generatePomFileForReleasePublication :library:androidSourcesJar --no-daemon --stacktrace

        # Toggle autoPublish property if requested
        PUBLISH_ARGS=""
        if [ "$AUTO_PUBLISH" = "true" ]; then
          PUBLISH_ARGS="-PautoPublish"
        fi

        # Publish via custom Gradle task that invokes Maven Central Portal plugin
        echo "Publishing to Maven Central via publishToCentralPortal..."
        ./gradlew publishToCentralPortal $PUBLISH_ARGS --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2g"

        echo "======================================================================"
        echo "Publish command completed. Check Sonatype Central Portal for status:"
        echo "https://central.sonatype.com/publishing/deployments"
        echo "======================================================================"