name: 'Publish to Maven Central'
description: 'Publishes all modules using the Maven Central Portal Plugin'
inputs:
  sonatype_user:
    description: 'Sonatype user'
    required: true
    default: ''
  sonatype_token:
    description: 'Sonatype user token'
    required: true
    default: ''
  signing_key_id:
    description: 'Signing key id'
    required: true
    default: ''
  signing_key_password:
    description: 'Signing key password'
    required: true
    default: ''
  signing_key_file:
    description: 'Signing key file'
    required: true
    default: ''
  auto_publish:
    description: 'Whether to publish automatically'
    required: false
    default: 'true'
  use_snapshot:
    description: 'Whether to publish as a SNAPSHOT version'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: 3.9.5

    - name: Create Maven settings directory
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/.mvn

    - name: Create Maven settings file
      shell: bash
      run: |
        cat > ${{ github.workspace }}/.mvn/maven-settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
                <server>
                    <id>central</id>
                    <username>${env.SONATYPE_NEXUS_USERNAME}</username>
                    <password>${env.SONATYPE_NEXUS_PASSWORD}</password>
                </server>
            </servers>
            <profiles>
                <profile>
                    <id>gpg</id>
                    <properties>
                        <gpg.executable>gpg</gpg.executable>
                        <gpg.keyname>${env.SIGNING_KEY_ID}</gpg.keyname>
                        <gpg.passphrase>${env.SIGNING_KEY_PASSWORD}</gpg.passphrase>
                    </properties>
                </profile>
            </profiles>
            <activeProfiles>
                <activeProfile>gpg</activeProfile>
            </activeProfiles>
        </settings>
        EOF

    - name: Prepare and publish via NMCP (library only)
      shell: bash
      env:
        SONATYPE_NEXUS_USERNAME: ${{ inputs.sonatype_user }}
        SONATYPE_NEXUS_PASSWORD: ${{ inputs.sonatype_token }}
        SIGNING_KEY_ID: ${{ inputs.signing_key_id }}
        SIGNING_KEY_PASSWORD: ${{ inputs.signing_key_password }}
        SIGNING_KEY_FILE: ${{ inputs.signing_key_file }}
        USE_SNAPSHOT: ${{ inputs.use_snapshot }}
        AUTO_PUBLISH: ${{ inputs.auto_publish }}
      run: |
        echo "Publishing via NMCP module plugin (:library)"

        if [ ! -d "${{ github.workspace }}/library" ]; then
          echo "Error: library directory not found"
          exit 1
        fi

        VERSION=$(grep -o '"sdkVersionName"\s*:\s*"[^"]*"' ${{ github.workspace }}/build.gradle | grep -o '"[^"]*"$' | tr -d '"')

        if [ "$USE_SNAPSHOT" = "true" ]; then
          [[ "$VERSION" != *-SNAPSHOT ]] && VERSION="${VERSION}-SNAPSHOT"
          echo "Publishing SNAPSHOT version: $VERSION"
        else
          [[ "$VERSION" == *-SNAPSHOT ]] && VERSION="${VERSION%-SNAPSHOT}"
          echo "Publishing release version: $VERSION"
        fi

        echo "Importing GPG key for signing"
        gpg --batch --import ${{ inputs.signing_key_file }}

        echo "Setting project version to ${VERSION}"
        ./gradlew -PversionParam="$VERSION" changeReleaseVersion --no-daemon --stacktrace

        echo "Cleaning and building artifacts..."
        ./gradlew clean :library:assembleRelease :library:generatePomFileForReleasePublication --no-daemon --stacktrace

        echo "Injecting NMCP plugin into :library"
        cp ${{ github.workspace }}/library/build.gradle ${{ github.workspace }}/library/build.gradle.backup

        # Insert plugin id into plugins block
        cat > ${{ github.workspace }}/inject-nmcp.awk << 'EOF'
        /^plugins \{/ {
          print $0
          print "\tid 'com.gradleup.nmcp' version '1.0.2'"
          next
        }
        { print }
        EOF
        awk -f ${{ github.workspace }}/inject-nmcp.awk ${{ github.workspace }}/library/build.gradle.backup > ${{ github.workspace }}/library/build.gradle

        # Append only task disables to avoid stray module metadata
        cat > ${{ github.workspace }}/library-nmcp-config.gradle << 'EOF'
        tasks.matching { it.name == "generateMetadataFileForReleasePublication" || it.name == "generateMetadataFileForMavenPublication" || it.name == "generateMetadataFileForPublication" }.configureEach { enabled = false }
        EOF
        cat ${{ github.workspace }}/library-nmcp-config.gradle >> ${{ github.workspace }}/library/build.gradle

        echo "Detecting NMCP publish task in :library"
        ./gradlew :library:tasks --all | cat
        PUBLISH_TASK="publishToCentralPortal"
        if [ "$USE_SNAPSHOT" = "true" ]; then
          PUBLISH_TASK="publishToCentralPortalSnapshots"
        fi
        # Fallback: verify the task exists; otherwise try to auto-detect any publish*CentralPortal task
        if ! ./gradlew -q :library:tasks --all | grep -q "${PUBLISH_TASK}"; then
          ALT=$(./gradlew -q :library:tasks --all | grep -Eo "publish[A-Za-z]*CentralPortal[A-Za-z]*" | head -1 || true)
          if [ -n "$ALT" ]; then PUBLISH_TASK="$ALT"; fi
        fi
        echo "Using task: :library:${PUBLISH_TASK}"

        echo "Publishing with :library:${PUBLISH_TASK}"
        ./gradlew :library:${PUBLISH_TASK} \
          -Psigning.keyId="${SIGNING_KEY_ID}" \
          -Psigning.password="${SIGNING_KEY_PASSWORD}" \
          -Psigning.secretKeyRingFile="${SIGNING_KEY_FILE}" \
          --no-daemon --stacktrace

        echo "Restoring :library build.gradle"
        mv ${{ github.workspace }}/library/build.gradle.backup ${{ github.workspace }}/library/build.gradle
        rm -f ${{ github.workspace }}/inject-nmcp.awk ${{ github.workspace }}/library-nmcp-config.gradle

        echo "======================================================================"
        echo "NMCP publish finished. Check Sonatype Central Portal for status:"
        echo "https://central.sonatype.com/publishing/deployments"
        echo "======================================================================"