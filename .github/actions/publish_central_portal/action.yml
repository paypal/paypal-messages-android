name: 'Publish to Central Portal'
description: 'Publishes all modules using the Sonatype Central Portal API'
inputs:
  sonatype_user:
    description: 'Sonatype user (deprecated - use env vars instead)'
    required: false
    default: ''
  sonatype_token:
    description: 'Sonatype user token (deprecated - use env vars instead)'
    required: false
    default: ''
  signing_key_id:
    description: 'Signing key id'
    required: true
    default: ''
  signing_key_password:
    description: 'Signing key password'
    required: true
    default: ''
  signing_key_file:
    description: 'Signing key file'
    required: true
    default: ''
  auto_publish:
    description: 'Whether to publish automatically'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - run: |
        # Safely check for required environment variables
        echo "::debug::Checking for required environment variables"
        
        # Only check if variables exist, never print their values
        if [ -n "$SONATYPE_NEXUS_USERNAME" ]; then
          echo "SONATYPE_NEXUS_USERNAME is available"
        else
          echo "Warning: SONATYPE_NEXUS_USERNAME is not set"
        fi
        
        if [ -n "$SONATYPE_NEXUS_PASSWORD" ]; then
          echo "SONATYPE_NEXUS_PASSWORD is available"
        else
          echo "Warning: SONATYPE_NEXUS_PASSWORD is not set"
        fi
        
        # Verify credentials are available in environment variables
        echo "Using environment variables from parent workflow"
        
        # Check for credentials in environment (without exposing values)
        if [ -n "$SONATYPE_NEXUS_USERNAME" ] && [ -n "$SONATYPE_NEXUS_PASSWORD" ]; then
          echo "Found Sonatype credentials in environment"
        else
          echo "Warning: One or more Sonatype credentials missing in environment"
          
          # Log a more helpful message about how to set up credentials
          echo "Make sure SONATYPE_NEXUS_USERNAME and SONATYPE_NEXUS_PASSWORD are set in your GitHub repository secrets"
          echo "and passed to this action using the 'env:' section in the workflow."
        fi
        
        # First publish library module which will handle signing
        ./gradlew --stacktrace :library:assemble
        ./gradlew --stacktrace :library:signArchives
        
        # Then run the central portal publishing with ALL possible property names
        if [ "${{ inputs.auto_publish }}" = "true" ]; then
          ./gradlew --stacktrace publishToCentralPortal -PautoPublish \
            -PsonatypeUsername="${{ inputs.sonatype_user }}" \
            -PsonatypePassword="${{ inputs.sonatype_token }}" \
            -PnexusUsername="${{ inputs.sonatype_user }}" \
            -PnexusPassword="${{ inputs.sonatype_token }}"
        else
          ./gradlew --stacktrace publishToCentralPortal \
            -PsonatypeUsername="${{ inputs.sonatype_user }}" \
            -PsonatypePassword="${{ inputs.sonatype_token }}" \
            -PnexusUsername="${{ inputs.sonatype_user }}" \
            -PnexusPassword="${{ inputs.sonatype_token }}"
        fi
        ./gradlew --stacktrace checkCentralPortalDeployment \
          -PsonatypeUsername="${{ inputs.sonatype_user }}" \
          -PsonatypePassword="${{ inputs.sonatype_token }}" \
          -PnexusUsername="${{ inputs.sonatype_user }}" \
          -PnexusPassword="${{ inputs.sonatype_token }}"
      shell: bash
      env:
        # Set both environment variables and pass as properties for redundancy
        SONATYPE_NEXUS_USERNAME: ${{ inputs.sonatype_user }}
        SONATYPE_NEXUS_PASSWORD: ${{ inputs.sonatype_token }}
        SIGNING_KEY_ID: ${{ inputs.signing_key_id }}
        SIGNING_KEY_PASSWORD: ${{ inputs.signing_key_password }}
        SIGNING_KEY_FILE: ${{ inputs.signing_key_file }}