name: 'Publish to Central Portal'
description: 'Publishes all modules using the Sonatype Central Portal API'
inputs:
  sonatype_user:
    description: 'Sonatype user'
    required: true
    default: ''
  sonatype_token:
    description: 'Sonatype user token'
    required: true
    default: ''
  signing_key_id:
    description: 'Signing key id'
    required: true
    default: ''
  signing_key_password:
    description: 'Signing key password'
    required: true
    default: ''
  signing_key_file:
    description: 'Signing key file'
    required: true
    default: ''
  auto_publish:
    description: 'Whether to publish automatically'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - run: |
        # Debug environment variables (safely)
        echo "::debug::Debugging environment variables"
        echo "sonatype_user input is empty: ${{ inputs.sonatype_user == '' }}"
        echo "sonatype_token input is empty: ${{ inputs.sonatype_token == '' }}"
        echo "SONATYPE_NEXUS_USERNAME is set: ${{ env.SONATYPE_NEXUS_USERNAME != '' }}"
        echo "SONATYPE_NEXUS_PASSWORD is set: ${{ env.SONATYPE_NEXUS_PASSWORD != '' }}"
        
        # List all env vars (without values)
        echo "Environment variables available:"
        env | cut -d= -f1 | grep -i sonatype || echo "No Sonatype env vars found"
        
        # Use directly from GitHub environment variables if available
        echo "Using environment variables from parent workflow"
        
        # Check for credentials already in environment
        if [ -n "$SONATYPE_NEXUS_PASSWORD" ]; then
          echo "Found SONATYPE_NEXUS_PASSWORD in environment, using it"
        else
          # Fall back to inputs if needed
          export SONATYPE_NEXUS_USERNAME="${{ inputs.sonatype_user }}"
          export SONATYPE_NEXUS_PASSWORD="${{ inputs.sonatype_token }}"
          echo "Exported credentials from inputs as fallback"
        fi
        
        # First publish library module which will handle signing
        ./gradlew --stacktrace :library:assemble
        ./gradlew --stacktrace :library:signArchives
        
        # Then run the central portal publishing with ALL possible property names
        if [ "${{ inputs.auto_publish }}" = "true" ]; then
          ./gradlew --stacktrace publishToCentralPortal -PautoPublish \
            -PsonatypeUsername="${{ inputs.sonatype_user }}" \
            -PsonatypePassword="${{ inputs.sonatype_token }}" \
            -PnexusUsername="${{ inputs.sonatype_user }}" \
            -PnexusPassword="${{ inputs.sonatype_token }}"
        else
          ./gradlew --stacktrace publishToCentralPortal \
            -PsonatypeUsername="${{ inputs.sonatype_user }}" \
            -PsonatypePassword="${{ inputs.sonatype_token }}" \
            -PnexusUsername="${{ inputs.sonatype_user }}" \
            -PnexusPassword="${{ inputs.sonatype_token }}"
        fi
        ./gradlew --stacktrace checkCentralPortalDeployment \
          -PsonatypeUsername="${{ inputs.sonatype_user }}" \
          -PsonatypePassword="${{ inputs.sonatype_token }}" \
          -PnexusUsername="${{ inputs.sonatype_user }}" \
          -PnexusPassword="${{ inputs.sonatype_token }}"
      shell: bash
      env:
        # Set both environment variables and pass as properties for redundancy
        SONATYPE_NEXUS_USERNAME: ${{ inputs.sonatype_user }}
        SONATYPE_NEXUS_PASSWORD: ${{ inputs.sonatype_token }}
        SIGNING_KEY_ID: ${{ inputs.signing_key_id }}
        SIGNING_KEY_PASSWORD: ${{ inputs.signing_key_password }}
        SIGNING_KEY_FILE: ${{ inputs.signing_key_file }}